name: Diagnose rider style columns
on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - scripts/diagnose_rider_style_columns.py
      - .github/workflows/diagnose_rider_style_columns.yml
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python scripts/diagnose_rider_style_columns.py
