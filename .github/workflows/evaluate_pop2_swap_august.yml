name: Evaluate pop2 swap August
on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - 'scripts/evaluate_pop2_swap_august.py'
      - '.github/workflows/evaluate_pop2_swap_august.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python scripts/evaluate_pop2_swap_august.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keirin_data/strategy_context/pop2_swap_august_diagnostic.csv keirin_data/strategy_context/pop2_swap_august_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add August pop2 swap diagnostic'
          git pull --rebase origin experiment/popular-head-skip-v01
          git push origin HEAD:experiment/popular-head-skip-v01
