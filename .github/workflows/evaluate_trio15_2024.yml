name: Evaluate 2024 OH_HIGH trio15

on:
  push:
    branches:
      - experiment/popular-head-skip-v01
    paths:
      - '.github/workflows/evaluate_trio15_2024.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  month:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        month: ['2024_01','2024_02','2024_03','2024_04','2024_05','2024_06','2024_07','2024_08','2024_09','2024_10','2024_11','2024_12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests beautifulsoup4 lxml html5lib
      - run: python scripts/evaluate_trio15_month.py --month ${{ matrix.month }}
      - name: Commit month outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keirin_data/strategy_context/oh_high_trio15_${{ matrix.month }}_results.csv
          git add keirin_data/strategy_context/oh_high_trio15_${{ matrix.month }}_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add OH_HIGH trio15 ${{ matrix.month }}"
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin experiment/popular-head-skip-v01 && git push origin HEAD:experiment/popular-head-skip-v01 && exit 0
            sleep $((i * 5))
          done
          exit 1
