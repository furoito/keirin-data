name: Extract core 20-40 top3-spread group-hit odds

on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - 'scripts/extract_core_20_40_top3spread_group_hits.py'
      - '.github/workflows/extract_core_20_40_top3spread_group_hits.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python scripts/extract_core_20_40_top3spread_group_hits.py
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add keirin_data/strategy_context/core_20_40_top3spread_group_hits.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add core 20-40 group-hit odds extract'
            git pull --rebase origin experiment/popular-head-skip-v01
            git push origin HEAD:experiment/popular-head-skip-v01
          fi
