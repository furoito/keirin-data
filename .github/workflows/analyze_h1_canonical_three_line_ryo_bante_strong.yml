name: Analyze H1 canonical three-line ryo-bante strong

on:
  push:
    branches:
      - experiment/popular-head-skip-v01
    paths:
      - 'scripts/analyze_h1_canonical_three_line_ryo_bante_strong.py'
      - '.github/workflows/analyze_h1_canonical_three_line_ryo_bante_strong.yml'
      - 'scripts/analyze_h1_canonical_three_line_ryo_bante_strong.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python scripts/analyze_h1_canonical_three_line_ryo_bante_strong.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add keirin_data/strategy_context/h1_canonical_three_line_ryo_bante_strong_summary.json
          git add keirin_data/strategy_context/h1_canonical_three_line_ryo_bante_strong_tickets.csv
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Add canonical three-line ryo-bante strong results'
            git fetch origin experiment/popular-head-skip-v01
            git rebase origin/experiment/popular-head-skip-v01
            git push origin HEAD:experiment/popular-head-skip-v01
          fi
