name: Evaluate other-head promotion OOS

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/popular-head-skip-v01
    paths:
      - 'scripts/evaluate_other_head_promotion_oos.py'
      - '.github/workflows/evaluate_other_head_promotion_oos.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests beautifulsoup4 lxml html5lib tqdm
      - run: python scripts/evaluate_other_head_promotion_oos.py
      - name: Commit evaluation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keirin_data/strategy_context/other_head_promotion_oos_results.csv \
                  keirin_data/strategy_context/other_head_promotion_oos_summary.json \
                  keirin_data/strategy_context/other_head_promotion_oos_result_repairs.csv || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add other-head promotion OOS evaluation'
          git pull --rebase origin experiment/popular-head-skip-v01
          git push origin HEAD:experiment/popular-head-skip-v01
