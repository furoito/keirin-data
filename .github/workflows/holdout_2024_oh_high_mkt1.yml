name: Holdout 2024 OH_HIGH MKT1

on:
  push:
    branches:
      - experiment/popular-head-skip-v01
    paths:
      - '.github/workflows/holdout_2024_oh_high_mkt1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  month:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {month: '2024_01', start: '2024-01-01', end: '2024-01-31'}
          - {month: '2024_02', start: '2024-02-01', end: '2024-02-29'}
          - {month: '2024_03', start: '2024-03-01', end: '2024-03-31'}
          - {month: '2024_04', start: '2024-04-01', end: '2024-04-30'}
          - {month: '2024_05', start: '2024-05-01', end: '2024-05-31'}
          - {month: '2024_06', start: '2024-06-01', end: '2024-06-30'}
          - {month: '2024_07', start: '2024-07-01', end: '2024-07-31'}
          - {month: '2024_08', start: '2024-08-01', end: '2024-08-31'}
          - {month: '2024_09', start: '2024-09-01', end: '2024-09-30'}
          - {month: '2024_10', start: '2024-10-01', end: '2024-10-31'}
          - {month: '2024_11', start: '2024-11-01', end: '2024-11-30'}
          - {month: '2024_12', start: '2024-12-01', end: '2024-12-31'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests beautifulsoup4 lxml html5lib tqdm
      - name: Build strategy context
        run: python scripts/backfill_strategy_context.py --start-date ${{ matrix.start }} --end-date ${{ matrix.end }} --classes A1,A2 --limit 80 --resume
      - name: Freeze OH_HIGH candidate decisions
        run: python scripts/validate_dual_logic_month.py --month ${{ matrix.month }}
      - name: Score frozen MKT1
        run: python scripts/evaluate_oh_high_mkt1_month.py --month ${{ matrix.month }}
      - name: Commit month outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keirin_data/strategy_context/${{ matrix.month }}_races.csv || true
          git add keirin_data/strategy_context/${{ matrix.month }}_odds_3rentan.csv || true
          git add keirin_data/strategy_context/dual_logic_${{ matrix.month }}_results.csv || true
          git add keirin_data/strategy_context/dual_logic_${{ matrix.month }}_summary.json || true
          git add keirin_data/strategy_context/dual_logic_${{ matrix.month }}_result_repairs.csv || true
          git add keirin_data/strategy_context/oh_high_mkt1_${{ matrix.month }}_results.csv || true
          git add keirin_data/strategy_context/oh_high_mkt1_${{ matrix.month }}_summary.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add frozen OH_HIGH MKT1 holdout ${{ matrix.month }}"
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin experiment/popular-head-skip-v01 && git push origin HEAD:experiment/popular-head-skip-v01 && exit 0
            sleep $((i * 5))
          done
          exit 1
