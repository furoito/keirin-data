name: Evaluate market ordering

on:
  push:
    branches:
      - experiment/popular-head-skip-v01
    paths:
      - '.github/workflows/evaluate_market_ordering.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python scripts/evaluate_market_ordering.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keirin_data/strategy_context/market_ordering_results.csv
          git add keirin_data/strategy_context/market_ordering_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add market ordering evaluation results"
          git pull --rebase origin experiment/popular-head-skip-v01
          git push origin HEAD:experiment/popular-head-skip-v01
