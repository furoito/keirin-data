name: Keirin strategy context backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        default: '2026-08-01'
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: true
        default: '2026-09-01'
      limit:
        description: 'Maximum races'
        required: true
        default: '100'
      classes:
        description: 'Player classes'
        required: true
        default: 'A1,A2'
  push:
    branches: [main]
    paths:
      - 'scripts/backfill_strategy_context.py'
      - '.github/workflows/backfill_strategy_context.yml'

permissions:
  contents: write

concurrency:
  group: keirin-strategy-context-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      START_DATE: ${{ github.event.inputs.start_date || '2026-08-01' }}
      END_DATE: ${{ github.event.inputs.end_date || '2026-09-01' }}
      LIMIT: ${{ github.event.inputs.limit || '100' }}
      CLASSES: ${{ github.event.inputs.classes || 'A1,A2' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill true lines and 3-ren-tan odds
        run: |
          python scripts/backfill_strategy_context.py \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --classes "$CLASSES" \
            --limit "$LIMIT" \
            --resume

      - name: Summarize quality
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          fps = sorted(Path('keirin_data/strategy_context').glob('*_races.csv'))
          if not fps:
              print('No strategy-context race files produced.')
              raise SystemExit(0)
          df = pd.concat([pd.read_csv(p, encoding='utf-8-sig', dtype={'race_id': str}) for p in fps], ignore_index=True)
          df = df.drop_duplicates('race_id', keep='last')
          print(f'races={len(df)}')
          for col in ['context_quality', 'line_quality', 'odds_quality', 'price_quality']:
              if col in df.columns:
                  print(f'\n{col}:')
                  print(df[col].fillna('NA').value_counts(dropna=False).to_string())
          if 'context_quality' in df.columns:
              full = df[df.context_quality == 'full']
              print(f'\nfull={len(full)}/{len(df)} ({len(full)/len(df)*100:.1f}%)')
          PY

      - name: Commit strategy context
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keirin_data/strategy_context/ || true
          if git diff --cached --quiet; then
            echo 'No strategy context changes.'
            exit 0
          fi
          git commit -m "Add keirin strategy context backfill"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            echo "Push failed ($i/5); retrying..."
            sleep 10
          done
          exit 1
