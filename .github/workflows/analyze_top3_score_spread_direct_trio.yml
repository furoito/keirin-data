name: Analyze direct top3-score spread trio

on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - '.github/workflows/analyze_top3_score_spread_direct_trio.yml'
      - 'scripts/analyze_top3_score_spread_direct_trio.py'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run direct top3-score spread trio analysis
        run: python scripts/analyze_top3_score_spread_direct_trio.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keirin_data/strategy_context/top3_score_spread_direct_trio_summary.json \
                  keirin_data/strategy_context/top3_score_spread_direct_trio_tickets.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Add direct top3-score spread trio results'
            git pull --rebase origin experiment/popular-head-skip-v01
            git push origin HEAD:experiment/popular-head-skip-v01
          fi
