name: Analyze score-rank order

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/popular-head-skip-v01
    paths:
      - 'scripts/analyze_score_rank_order.py'
      - '.github/workflows/analyze_score_rank_order.yml'
      - 'keirin_data/strategy_context/formation_box_chain_expanded_groups.csv'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scipy
      - run: python scripts/analyze_score_rank_order.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add keirin_data/strategy_context/score_rank_order_summary.json keirin_data/strategy_context/score_rank_order_tickets.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add score-rank ordered results'
          git push origin HEAD:experiment/popular-head-skip-v01
