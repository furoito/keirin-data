name: Evaluate frozen priority order v01b

on:
  push:
    branches:
      - experiment/popular-head-skip-v01
    paths:
      - 'scripts/evaluate_priority_order_v01b.py'
      - '.github/workflows/evaluate_priority_order_v01b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python scripts/evaluate_priority_order_v01b.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keirin_data/strategy_context/priority_order_v01b_results.csv \
                  keirin_data/strategy_context/priority_order_v01b_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add frozen priority order evaluation'
          git pull --rebase origin experiment/popular-head-skip-v01
          git push origin HEAD:experiment/popular-head-skip-v01
