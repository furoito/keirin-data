name: Test H1 popular-line head overpricing

on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - 'scripts/test_h1_popular_head_overpricing.py'
      - '.github/workflows/test_h1_popular_head_overpricing.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run H1 test
        run: python scripts/test_h1_popular_head_overpricing.py
