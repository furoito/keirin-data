name: Analyze role score-band flatness

on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - 'scripts/analyze_role_scoreband_flatness.py'
      - '.github/workflows/analyze_role_scoreband_flatness.yml'
      - 'keirin_data/strategy_context/formation_box_chain_expanded_groups.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python scripts/analyze_role_scoreband_flatness.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add keirin_data/strategy_context/role_scoreband_flatness_summary.json
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Add role score-band flatness results'
            git pull --rebase origin experiment/popular-head-skip-v01
            git push origin HEAD:experiment/popular-head-skip-v01
          fi
