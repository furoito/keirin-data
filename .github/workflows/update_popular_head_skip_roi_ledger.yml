name: Update popular-head-skip ROI ledger

on:
  push:
    branches:
      - experiment/popular-head-skip-v01
    paths:
      - 'keirin_data/strategy_context/single_bonus_order_july_summary.json'
      - 'keirin_data/strategy_context/pop2_plus3_order_summary.json'
      - 'scripts/update_popular_head_skip_roi_ledger.py'
      - '.github/workflows/update_popular_head_skip_roi_ledger.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python scripts/update_popular_head_skip_roi_ledger.py
      - name: Commit ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keirin_data/strategy_context/popular_head_skip_roi_ledger.csv \
                  keirin_data/strategy_context/popular_head_skip_roi_ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update popular-head-skip ROI ledger'
          git pull --rebase origin experiment/popular-head-skip-v01
          git push origin HEAD:experiment/popular-head-skip-v01
