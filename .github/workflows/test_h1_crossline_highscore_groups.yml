name: Test H1 cross-line high-score groups

on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - 'scripts/test_h1_crossline_highscore_groups.py'
      - '.github/workflows/test_h1_crossline_highscore_groups.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Run group-level H1 test
        run: python scripts/test_h1_crossline_highscore_groups.py
