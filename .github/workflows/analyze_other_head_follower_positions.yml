name: Analyze other head follower positions
on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - scripts/analyze_other_head_follower_positions.py
      - .github/workflows/analyze_other_head_follower_positions.yml
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python scripts/analyze_other_head_follower_positions.py
