name: Analyze H1 no escape no third groups

on:
  push:
    branches:
      - experiment/popular-head-skip-v01
    paths:
      - 'scripts/analyze_h1_no_escape_no_third_groups.py'
      - '.github/workflows/analyze_h1_no_escape_no_third_groups.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python scripts/analyze_h1_no_escape_no_third_groups.py
      - name: Commit analysis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keirin_data/strategy_context/h1_no_escape_no_third_groups_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add H1 no-escape no-third group diagnostic results'
          git pull --rebase origin experiment/popular-head-skip-v01
          git push origin HEAD:experiment/popular-head-skip-v01
