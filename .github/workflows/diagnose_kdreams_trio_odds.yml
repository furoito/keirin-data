name: Diagnose KDreams trio odds
on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - '.github/workflows/diagnose_kdreams_trio_odds.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests beautifulsoup4 lxml html5lib
      - run: python scripts/diagnose_kdreams_trio_odds.py
