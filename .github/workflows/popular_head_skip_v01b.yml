name: Popular head skip v0.1b backtest

on:
  push:
    branches:
      - experiment/popular-head-skip-v01
    paths:
      - 'scripts/popular_head_skip_v01b.py'
      - '.github/workflows/popular_head_skip_v01b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Run August 2026 v0.1b
        run: |
          python scripts/popular_head_skip_v01b.py --month 2026_08 \
            --out keirin_data/strategy_context/popular_head_skip_v01b_results.csv \
            --summary keirin_data/strategy_context/popular_head_skip_v01b_summary.json
      - name: Show summary
        run: cat keirin_data/strategy_context/popular_head_skip_v01b_summary.json
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keirin_data/strategy_context/popular_head_skip_v01b_results.csv \
                  keirin_data/strategy_context/popular_head_skip_v01b_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add popular head skip v0.1b August results'
          git push origin HEAD:experiment/popular-head-skip-v01
