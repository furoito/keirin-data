name: Analyze OH_HIGH MKT1 style ROI
on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - scripts/analyze_oh_high_mkt1_style_roi.py
      - .github/workflows/analyze_oh_high_mkt1_style_roi.yml
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python scripts/analyze_oh_high_mkt1_style_roi.py
