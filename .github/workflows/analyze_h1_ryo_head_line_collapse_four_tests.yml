name: Analyze H1 ryo-head line-collapse four tests

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/popular-head-skip-v01
    paths:
      - scripts/analyze_h1_ryo_head_line_collapse_four_tests.py
      - .github/workflows/analyze_h1_ryo_head_line_collapse_four_tests.yml

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python scripts/analyze_h1_ryo_head_line_collapse_four_tests.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add keirin_data/strategy_context/h1_ryo_head_line_collapse_four_tests_summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add ryo-head line-collapse four-test results'
          git pull --rebase origin experiment/popular-head-skip-v01
          git push origin HEAD:experiment/popular-head-skip-v01
