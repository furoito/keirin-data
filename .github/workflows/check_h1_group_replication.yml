name: Check H1 group replication

on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - 'scripts/check_h1_group_replication.py'
      - '.github/workflows/check_h1_group_replication.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Run replication check
        run: python scripts/check_h1_group_replication.py
