name: Analyze no escape no third

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/popular-head-skip-v01
    paths:
      - 'scripts/analyze_no_escape_no_third.py'
      - '.github/workflows/analyze_no_escape_no_third.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python scripts/analyze_no_escape_no_third.py
      - name: Commit analysis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keirin_data/strategy_context/no_escape_no_third_summary.json \
                  keirin_data/strategy_context/no_escape_no_third_cases.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add no-escape no-third diagnostic results'
          git pull --rebase origin experiment/popular-head-skip-v01
          git push origin HEAD:experiment/popular-head-skip-v01
