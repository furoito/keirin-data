name: Diagnose Kdreams 2shatan odds
on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - 'scripts/diagnose_kdreams_2shatan_odds.py'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests beautifulsoup4 lxml
      - run: python scripts/diagnose_kdreams_2shatan_odds.py
