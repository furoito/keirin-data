name: Analyze other head line cooccurrence
on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - scripts/analyze_other_head_line_cooccurrence.py
      - .github/workflows/analyze_other_head_line_cooccurrence.yml
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python scripts/analyze_other_head_line_cooccurrence.py
      - name: Commit outputs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add keirin_data/strategy_context/other_head_line_cooccurrence_cases.csv keirin_data/strategy_context/other_head_line_cooccurrence_summary.json
          git commit -m "Analyze other-head line cooccurrence" || exit 0
          git push
