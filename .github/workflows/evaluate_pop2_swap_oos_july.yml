name: Evaluate pop2 swap OOS July

on:
  push:
    branches:
      - experiment/popular-head-skip-v01
    paths:
      - 'scripts/evaluate_pop2_swap_oos_july.py'
      - '.github/workflows/evaluate_pop2_swap_oos_july.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Build July strategy context if missing
        run: |
          python scripts/backfill_strategy_context.py --start-date 2026-07-01 --end-date 2026-07-31 --classes A1,A2 --limit 80 --resume
      - run: python scripts/evaluate_pop2_swap_oos_july.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keirin_data/strategy_context/2026_07_races.csv \
                  keirin_data/strategy_context/2026_07_odds_3rentan.csv \
                  keirin_data/strategy_context/pop2_swap_oos_july.csv \
                  keirin_data/strategy_context/pop2_swap_oos_july_summary.json \
                  keirin_data/strategy_context/pop2_swap_oos_july_result_repairs.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add July OOS pop2 swap diagnostic'
          git pull --rebase origin experiment/popular-head-skip-v01
          git push origin HEAD:experiment/popular-head-skip-v01
