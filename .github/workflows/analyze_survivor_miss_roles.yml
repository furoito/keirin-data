name: Analyze survivor miss roles

on:
  push:
    branches:
      - experiment/popular-head-skip-v01
    paths:
      - 'scripts/analyze_survivor_miss_roles.py'
      - '.github/workflows/analyze_survivor_miss_roles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python scripts/analyze_survivor_miss_roles.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keirin_data/strategy_context/survivor_miss_roles.csv \
                  keirin_data/strategy_context/survivor_miss_roles_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add survivor miss role analysis'
          git pull --rebase origin experiment/popular-head-skip-v01
          git push origin HEAD:experiment/popular-head-skip-v01
