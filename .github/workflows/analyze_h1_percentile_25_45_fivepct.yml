name: Analyze H1 percentile 25-45 fivepct
on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - 'scripts/analyze_h1_percentile_25_45_fivepct.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python scripts/analyze_h1_percentile_25_45_fivepct.py
      - name: Commit analysis
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add keirin_data/strategy_context/h1_percentile_25_45_fivepct_summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add 25-45 percentile 5pct results'
          git pull --rebase origin experiment/popular-head-skip-v01
          git push origin HEAD:experiment/popular-head-skip-v01
