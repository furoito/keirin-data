name: Analyze expanded formation-to-box sample

on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - 'scripts/analyze_formation_box_chain_expanded.py'
      - '.github/workflows/analyze_formation_box_chain_expanded.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scipy
      - run: python scripts/analyze_formation_box_chain_expanded.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keirin_data/strategy_context/formation_box_chain_expanded_summary.json keirin_data/strategy_context/formation_box_chain_expanded_groups.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Add expanded formation-box sample results'
            git pull --rebase origin experiment/popular-head-skip-v01
            git push origin HEAD:experiment/popular-head-skip-v01
          fi
