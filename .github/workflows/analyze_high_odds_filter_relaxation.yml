name: Analyze high-odds filter relaxation

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/popular-head-skip-v01
    paths:
      - 'scripts/analyze_high_odds_filter_relaxation.py'
      - '.github/workflows/analyze_high_odds_filter_relaxation.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python scripts/analyze_high_odds_filter_relaxation.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add keirin_data/strategy_context/high_odds_filter_relaxation_summary.json
          git diff --cached --quiet || git commit -m 'Add high-odds filter relaxation result'
          git pull --rebase origin experiment/popular-head-skip-v01
          git push
