name: Diagnose strategy sample funnel
on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - scripts/diagnose_strategy_sample_funnel.py
      - .github/workflows/diagnose_strategy_sample_funnel.yml
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python scripts/diagnose_strategy_sample_funnel.py
