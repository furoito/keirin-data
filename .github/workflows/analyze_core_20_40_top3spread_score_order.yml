name: Analyze core 20-40 top3-spread score order

on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - 'scripts/analyze_core_20_40_top3spread_score_order.py'
      - '.github/workflows/analyze_core_20_40_top3spread_score_order.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scipy
      - run: python scripts/analyze_core_20_40_top3spread_score_order.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add keirin_data/strategy_context/core_20_40_top3spread_score_order_summary.json keirin_data/strategy_context/core_20_40_top3spread_score_order_tickets.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Add score-order comparison results'
            git pull --rebase origin experiment/popular-head-skip-v01
            git push origin HEAD:experiment/popular-head-skip-v01
          fi
