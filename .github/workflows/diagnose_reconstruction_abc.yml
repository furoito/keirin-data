name: Diagnose reconstruction A B C

on:
  push:
    branches: [experiment/popular-head-skip-v01]
    paths:
      - 'scripts/diagnose_reconstruction_abc.py'
      - '.github/workflows/diagnose_reconstruction_abc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/popular-head-skip-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python scripts/diagnose_reconstruction_abc.py
      - name: Commit diagnostic outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keirin_data/strategy_context/reconstruction_abc_diagnostic.csv \
                  keirin_data/strategy_context/reconstruction_abc_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add reconstruction A B C diagnostic results'
          git push origin HEAD:experiment/popular-head-skip-v01
